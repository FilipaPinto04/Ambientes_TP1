<!DOCTYPE html>
<html>
<head>
    <title>AmIS - Carregar Dados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Importar Dados Apple Health</h4>
                    </div>
                    <div class="card-body">
                        <p>Selecione o ficheiro <b>export.xml</b> para atualizar a sua análise de sono.</p>
                        
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input class="form-control" type="file" name="xml_file" accept=".xml" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Processar e Analisar</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a href="{% url 'dashboard' %}" class="btn btn-link">Voltar à Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
