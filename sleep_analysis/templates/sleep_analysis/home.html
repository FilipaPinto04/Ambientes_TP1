<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Analysis - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Fundo do browser */
        body { 
            background-color: #1e293b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* O "Retângulo" da aplicação */
        .app-container { 
            width: 100%; 
            max-width: 414px; 
            background-color: #0f172a; 
            height: 90vh;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;     /* Centra verticalmente */
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1rem;
            overflow: hidden;
        }

        /* O Card de Login (Glassmorphism) */
        .glass-card { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 2.5rem; 
            padding: 3.5rem 2rem;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        /* Estilo do botão Google */
        .google-btn {
            background-color: white;
            color: #1f2937;
            font-weight: 700;
            padding: 0.9rem 1.5rem;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            margin-top: 2.5rem;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .google-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background-color: #f8fafc;
        }

        .google-btn:active {
            transform: scale(0.98);
        }

        /* Ícone da Lua com Gradiente */
        .logo-icon {
            font-size: 4.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.3));
        }

        /* Pequena animação de entrada */
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="glass-card fade-in">
            <div class="logo-icon">
                <i class="fa-solid fa-moon"></i>
            </div>

            <h1 class="text-3xl font-black text-white mb-3 tracking-tight">
                Sleep Analysis
            </h1>

            <a href="{% url 'google_fit_auth' %}" class="google-btn">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google" class="w-5 h-5">
                <span>Entrar com o Google Fit</span>
            </a>

            <div class="mt-12">
                <p class="text-[10px] text-slate-600 uppercase tracking-[0.2em] font-black">
                    Health System v2.0
                </p>
            </div>
        </div>

    </div>

</body>
</html>
