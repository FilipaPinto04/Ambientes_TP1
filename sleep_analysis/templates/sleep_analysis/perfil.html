<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepApp - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding-bottom: 80px; }
        .app-shell { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; }
        .profile-header { background: #1a237e; color: white; padding: 50px 20px; text-align: center; border-radius: 0 0 40px 40px; }
        .avatar { font-size: 60px; background: white; width: 100px; height: 100px; line-height: 100px; border-radius: 50%; margin: 0 auto 15px; }
        .menu-item { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; text-decoration: none; color: #333; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #fff; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; }
        .nav-link { text-decoration: none; color: #888; font-size: 12px; text-align: center; }
        .nav-link.active { color: #1a237e; font-weight: bold; }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="profile-header shadow">
        {% if request.session.user_picture %}
            <img src="{{ request.session.user_picture }}" class="rounded-circle mb-3" style="width:100px; height:100px; border: 3px solid white;">
        {% else %}
            <div class="avatar">👤</div>
        {% endif %}
        
        <h3 class="fw-bold">{{ request.session.user_name|default:"Utilizador" }}</h3>
        <p class="small opacity-75">Utilizador Google Fit Ativo</p>
    </div>

    <div class="mt-4">
        <div class="menu-item">
            <span>Notificações</span>
            <span class="text-success">Ligado</span>
        </div>
        <div class="menu-item">
            <span>Unidades de Medida</span>
            <span class="text-muted">Métrico (°C, Kg)</span>
        </div>
        <a href="https://myaccount.google.com/permissions" target="_blank" class="menu-item text-primary">
            <span>Gerir Permissões Google</span>
            <span>➔</span>
        </a>
        <a href="/" class="menu-item text-danger">
            <span>Sair da Aplicação</span>
            <span>🚪</span>
        </a>
    </div>
</div>

<nav class="bottom-nav">
    <a href="{% url 'dashboard' %}" class="nav-link">📊<br>Dashboard</a>
    <a href="{% url 'doencas' %}" class="nav-link">📚<br>Doenças</a>
    <a href="#" class="nav-link active">👤<br>Perfil</a>
</nav>
</body>
</html>
